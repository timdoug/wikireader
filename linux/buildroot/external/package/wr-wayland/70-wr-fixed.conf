<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- X's misc-fixed bitmap font, which the default configuration rejects as
     a bitmap, accepted and made the monospace font. -->
<fontconfig>
	<selectfont>
		<acceptfont>
			<pattern>
				<patelt name="family"><string>Fixed</string></patelt>
			</pattern>
		</acceptfont>
	</selectfont>
	<alias>
		<family>monospace</family>
		<prefer><family>Fixed</family></prefer>
	</alias>
</fontconfig>
