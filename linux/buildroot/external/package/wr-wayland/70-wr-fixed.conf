<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig's whole configuration beside fonts.conf: X's misc-fixed, the
     only font, is the monospace font, and X's encoding tables, which share
     the font directory, are not tried as fonts. -->
<fontconfig>
	<selectfont>
		<rejectfont>
			<glob>/usr/share/fonts/X11/*</glob>
		</rejectfont>
	</selectfont>
	<alias>
		<family>monospace</family>
		<prefer><family>Fixed</family></prefer>
	</alias>
</fontconfig>
