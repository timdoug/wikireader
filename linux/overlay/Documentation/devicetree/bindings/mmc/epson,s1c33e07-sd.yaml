%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/epson,s1c33e07-sd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 synchronous serial interface as an SD host

maintainers:
  - Tim Douglas <me@timdoug.com>

description:
  The synchronous serial interface run as an SD host in SPI mode, its
  transfers made by two DMA channels, with internal video RAM holding the
  all-ones the transmit channel sends while it receives.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: epson,s1c33e07-sd

  reg:
    items:
      - description: The serial interface's registers
      - description: Its DMA flags in the interrupt controller's block
      - description: Its IDMA request in the interrupt controller's block
      - description: Internal RAM for the transmit stream

  reg-names:
    items:
      - const: spi
      - const: spi-flags
      - const: idma
      - const: sram

  clocks:
    maxItems: 1

  dmas:
    items:
      - description: Transmit
      - description: Receive

  dma-names:
    items:
      - const: tx
      - const: rx

  cs-gpios:
    maxItems: 1

  pinctrl-names:
    items:
      - const: default
      - const: hold
    description:
      The hold state parks the clock pin at its idle level while the
      interface restarts.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - dmas
  - dma-names
  - cs-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/epson,s1c33e07-cmu.h>
    #include <dt-bindings/gpio/gpio.h>

    mmc@301700 {
        compatible = "epson,s1c33e07-sd";
        reg = <0x301700 0x20>, <0x300289 0x1>, <0x30029b 0x2>,
              <0x084000 0x200>;
        reg-names = "spi", "spi-flags", "idma", "sram";
        clocks = <&cmu S1C33_CLK_SPI>;
        dmas = <&hsdma 2 9>, <&hsdma 3 9>;
        dma-names = "tx", "rx";
        cs-gpios = <&pinctrl 40 GPIO_ACTIVE_LOW>;
        vmmc-supply = <&sd_vcc>;
    };
