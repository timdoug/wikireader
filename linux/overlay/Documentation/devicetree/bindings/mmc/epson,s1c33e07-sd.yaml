%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/epson,s1c33e07-sd.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 synchronous serial interface as an SD host

maintainers:
  - Tim Douglas <me@timdoug.com>

description:
  The synchronous serial interface run as an SD host in SPI mode, its
  transfers made by two DMA channels, with internal video RAM holding the
  all-ones the transmit channel sends while it receives.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: epson,s1c33e07-sd

  reg:
    items:
      - description: The serial interface's registers
      - description: Internal RAM for the transmit stream

  reg-names:
    items:
      - const: spi
      - const: sram

  interrupts:
    items:
      - description: The receive DMA request, polled
      - description: The transmit DMA request, polled

  interrupt-names:
    items:
      - const: rx
      - const: tx

  clocks:
    maxItems: 1

  dmas:
    items:
      - description: Transmit
      - description: Receive

  dma-names:
    items:
      - const: tx
      - const: rx

  cs-gpios:
    maxItems: 1

  pinctrl-names:
    items:
      - const: default
      - const: hold
    description:
      The hold state parks the clock pin at its idle level while the
      interface restarts.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - dmas
  - dma-names
  - cs-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/epson,s1c33e07-cmu.h>
    #include <dt-bindings/gpio/gpio.h>

    mmc@301700 {
        compatible = "epson,s1c33e07-sd";
        reg = <0x301700 0x20>, <0x084000 0x200>;
        reg-names = "spi", "sram";
        interrupts = <81 0>, <82 0>;
        interrupt-names = "rx", "tx";
        clocks = <&cmu S1C33_CLK_SPI>;
        dmas = <&itc 2 9>, <&itc 3 9>;
        dma-names = "tx", "rx";
        cs-gpios = <&pinctrl 40 GPIO_ACTIVE_LOW>;
        vmmc-supply = <&sd_vcc>;
    };
