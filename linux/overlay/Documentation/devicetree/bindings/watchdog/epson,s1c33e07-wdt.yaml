%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/epson,s1c33e07-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 watchdog timer

maintainers:
  - Tim Douglas <me@timdoug.com>

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: epson,s1c33e07-wdt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/epson,s1c33e07-cmu.h>

    watchdog@300660 {
        compatible = "epson,s1c33e07-wdt";
        reg = <0x300660 0x10>;
        clocks = <&cmu S1C33_CLK_WDT>;
    };
