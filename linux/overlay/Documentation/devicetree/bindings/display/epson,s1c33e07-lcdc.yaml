%YAML 1.2
---
$id: http://devicetree.org/schemas/display/epson,s1c33e07-lcdc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 LCD controller

maintainers:
  - Tim Douglas <me@timdoug.com>

description:
  The LCD controller scanning a one-bit-a-pixel image from internal video
  RAM or SDRAM onto a 4-bit monochrome panel interface.  Its images are
  framebuffers in SDRAM; the internal video RAM is not described here,
  since the platform may take it as general-purpose RAM.

properties:
  compatible:
    const: epson,s1c33e07-lcdc

  reg:
    items:
      - description: The controller's registers

  reg-names:
    items:
      - const: lcdc

  enable-gpios:
    maxItems: 1
    description: The panel's display-enable line

required:
  - compatible
  - reg
  - reg-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    display-controller@301a00 {
        compatible = "epson,s1c33e07-lcdc";
        reg = <0x301a00 0x100>;
        reg-names = "lcdc";
        enable-gpios = <&pinctrl 24 GPIO_ACTIVE_HIGH>;
    };
