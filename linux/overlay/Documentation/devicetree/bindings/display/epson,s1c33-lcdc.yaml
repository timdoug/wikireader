%YAML 1.2
---
$id: http://devicetree.org/schemas/display/epson,s1c33-lcdc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 LCD controller

maintainers:
  - Tim Douglas <me@timdoug.com>

description:
  The LCD controller scanning a one-bit-a-pixel image from internal video
  RAM or SDRAM onto a 4-bit monochrome panel interface.

properties:
  compatible:
    const: epson,s1c33-lcdc

  reg:
    items:
      - description: Internal video RAM, for the image the controller scans
      - description: The controller's registers

  reg-names:
    items:
      - const: vram
      - const: lcdc

  enable-gpios:
    maxItems: 1
    description: The panel's display-enable line

required:
  - compatible
  - reg
  - reg-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    display-controller@80000 {
        compatible = "epson,s1c33-lcdc";
        reg = <0x080000 0x1a00>, <0x301a00 0x100>;
        reg-names = "vram", "lcdc";
        enable-gpios = <&pinctrl 24 GPIO_ACTIVE_HIGH>;
    };
