%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/epson,s1c33e07-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 16-bit timer as a PWM

maintainers:
  - Tim Douglas <me@timdoug.com>

description:
  One of the 16-bit timers driving its output pin as a PWM.

allOf:
  - $ref: pwm.yaml#

properties:
  compatible:
    const: epson,s1c33e07-pwm

  reg:
    items:
      - description: The timer's registers
      - description: The timer's clock control register

  reg-names:
    items:
      - const: timer
      - const: clock

  clocks:
    maxItems: 1

  '#pwm-cells':
    const: 3

required:
  - compatible
  - reg
  - reg-names
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/epson,s1c33e07-cmu.h>

    pwm@300788 {
        compatible = "epson,s1c33e07-pwm";
        reg = <0x300788 0x8>, <0x3007e2 0x2>;
        reg-names = "timer", "clock";
        clocks = <&cmu S1C33_CLK_TM1>;
        #pwm-cells = <3>;
    };
