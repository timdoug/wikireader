%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/epson,s1c33e07-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 synchronous serial interface as an SPI controller

maintainers:
  - Tim Douglas <me@timdoug.com>

description:
  The synchronous serial interface in SPI master mode.  Transfers of whole
  words go by two high-speed DMA channels, 32 bits a character; the port's
  DMA requests are interrupt causes, polled.  Changing the character size
  disables the port, so a hold pin state parks SCLK at its idle level
  across it.

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: epson,s1c33e07-spi

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: The receive DMA request, polled
      - description: The transmit DMA request, polled

  interrupt-names:
    items:
      - const: rx
      - const: tx

  clocks:
    maxItems: 1

  dmas:
    items:
      - description: Receive
      - description: Transmit

  dma-names:
    items:
      - const: rx
      - const: tx

  pinctrl-names:
    items:
      - const: default
      - const: hold

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/epson,s1c33e07-cmu.h>
    #include <dt-bindings/gpio/gpio.h>

    spi@301700 {
        compatible = "epson,s1c33e07-spi";
        reg = <0x301700 0x20>;
        interrupts = <81 0>, <82 0>;
        interrupt-names = "rx", "tx";
        clocks = <&cmu S1C33_CLK_SPI>;
        dmas = <&itc 3 9>, <&itc 2 9>;
        dma-names = "rx", "tx";
        cs-gpios = <&pinctrl 40 GPIO_ACTIVE_LOW>;
        #address-cells = <1>;
        #size-cells = <0>;

        mmc@0 {
            compatible = "mmc-spi-slot";
            reg = <0>;
            spi-max-frequency = <15000000>;
            voltage-ranges = <3200 3400>;
        };
    };
