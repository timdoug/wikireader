%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/epson,s1c33-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 serial interface in asynchronous mode

maintainers:
  - Tim Douglas <me@timdoug.com>

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: epson,s1c33-uart

  reg:
    maxItems: 1

  reg-names:
    const: uart

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    items:
      - enum: [rx, error]
      - const: rx

  clocks:
    maxItems: 1

  epson,rx-only:
    type: boolean
    description:
      The port only receives; its transmit pin is left to other uses.

  current-speed:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: The line's speed, in bits a second

  wakeup-source: true

  touchscreen:
    type: object
    description: A touchscreen controller on the line, a serdev device

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - current-speed

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/s1c33-cmu.h>

    serial@300b00 {
        compatible = "epson,s1c33-uart";
        reg = <0x300b00 0x8>;
        reg-names = "uart";
        interrupts = <57 5>;
        interrupt-names = "rx";
        clocks = <&cmu S1C33_CLK_EFSIO>;
        current-speed = <115200>;
    };
