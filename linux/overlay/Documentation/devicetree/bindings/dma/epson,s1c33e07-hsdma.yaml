%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/epson,s1c33e07-hsdma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 high-speed DMA controller

maintainers:
  - Tim Douglas <me@timdoug.com>

description:
  Four channels, each with triggers of its own, chosen in the interrupt
  controller's block.  Clients request a channel through the interrupt
  controller, the DMA router, which hands this controller the channel.
  Each channel's end-of-transfer interrupt is polled.

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    const: epson,s1c33e07-hsdma

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: Channel 0's end of transfer
      - description: Channel 1's end of transfer
      - description: Channel 2's end of transfer
      - description: Channel 3's end of transfer

  clocks:
    maxItems: 1

  '#dma-cells':
    const: 1
    description: The channel, 0 to 3.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - '#dma-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/epson,s1c33e07-cmu.h>

    dma-controller@301100 {
        compatible = "epson,s1c33e07-hsdma";
        reg = <0x301100 0xa0>;
        interrupts = <22 0>, <23 0>, <24 0>, <25 0>;
        clocks = <&cmu S1C33_CLK_HSDMA>;
        #dma-cells = <1>;
    };
