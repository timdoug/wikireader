%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/epson,s1c33e07-adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Epson S1C33E07 analogue-to-digital converter

maintainers:
  - Tim Douglas <me@timdoug.com>

description:
  A 10-bit converter with eight inputs, AIN0 to AIN7, measured against the
  reference voltage.

properties:
  compatible:
    const: epson,s1c33e07-adc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  vref-supply: true

  '#io-channel-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - vref-supply
  - '#io-channel-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/epson,s1c33e07-cmu.h>

    adc@300520 {
        compatible = "epson,s1c33e07-adc";
        reg = <0x300520 0x40>;
        clocks = <&cmu S1C33_CLK_ADC>;
        vref-supply = <&avdd>;
        #io-channel-cells = <1>;
    };
