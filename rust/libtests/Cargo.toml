# core's and alloc's own test suites (library/coretests and alloctests in
# the rust checkout), built for C33 Linux as ordinary cargo tests, a
# package a part (split.py).
[workspace]
resolver = "3"
members = ["core-1", "core-2", "core-3", "alloc-1", "alloc-2", "alloc-3"]

[profile.release]
opt-level = 2
debug-assertions = true
