# core's and alloc's own test suites (library/coretests, alloctests in the
# rust checkout), built for C33 Linux as ordinary cargo tests.
[package]
name = "libtests"
version = "0.0.0"
edition = "2024"
autotests = false

[lib]
path = "src/lib.rs"
test = false

# Generated by split.py: each suite in parts small enough to run.
[[test]]
name = "coretests-1"
path = "../work/rust/library/coretests/tests/c33_part1.rs"

[[test]]
name = "coretests-2"
path = "../work/rust/library/coretests/tests/c33_part2.rs"

[[test]]
name = "coretests-3"
path = "../work/rust/library/coretests/tests/c33_part3.rs"

[[test]]
name = "alloctests-1"
path = "../work/rust/library/alloctests/tests/c33_part1.rs"

[[test]]
name = "alloctests-2"
path = "../work/rust/library/alloctests/tests/c33_part2.rs"

[[test]]
name = "alloctests-3"
path = "../work/rust/library/alloctests/tests/c33_part3.rs"


[dev-dependencies]
rand = { version = "0.9.0", default-features = false, features = ["alloc"] }
rand_xorshift = "0.4.0"



[profile.release]
opt-level = 2
debug-assertions = true
